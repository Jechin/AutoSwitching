name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AutoSwitching.sln

      - name: Build
        run: dotnet build AutoSwitching.sln -c Release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSwitching-Release
          path: src/AutoSwitching/bin/Release/net48/AutoSwitching.exe
          if-no-files-found: error
          retention-days: 14

  # 注意：跨进程 IME 切换需要目标窗口拿到真实键盘焦点，
  # 在 GitHub Actions 的无人值守环境里无法可靠验证，故不纳入 CI。
  # 自动化检查（产物 + 进程内自检 + 配置读写）可在本机运行：
  #   powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1

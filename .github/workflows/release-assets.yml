name: release-assets

# 手动触发：在 runner 上构建单文件 exe 并挂到指定 Release 上。
#
# 目标框架是 net48，产物是单个约 45 KB 的 exe，零运行时依赖，
# 因此不再需要区分「自包含 / 依赖运行时」两种包，只有一个 zip。
#
# 之所以仍放在 runner 上构建：本机网络经公司代理、上传受限，
# 且可保证发布物由干净的 CI 环境产出。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要附加资产的 tag（必须已存在）'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/AutoSwitching/AutoSwitching.csproj
          $v = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { $v = '2.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"

      - name: Build
        shell: pwsh
        run: |
          # net48 只需普通 build，不需要 publish / RID / 单文件打包参数
          dotnet build src/AutoSwitching/AutoSwitching.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Package
        shell: pwsh
        run: |
          $exe = "src/AutoSwitching/bin/Release/net48/AutoSwitching.exe"
          if (-not (Test-Path $exe)) { throw "not found: $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 只打包 exe 本身：它是自包含的，不需要 .exe.config
          Compress-Archive -Path $exe `
            -DestinationPath "dist/AutoSwitching-${{ steps.ver.outputs.version }}-win-x64.zip" -Force

      - name: Show checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "$($_.Name)  sha256=$h  size=$([math]::Round($_.Length/1KB,1))KB"
          }

      - name: Upload asset to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          Get-ChildItem dist/*.zip | ForEach-Object {
            Write-Host "uploading $($_.Name) to release $tag"
            gh release upload $tag $_.FullName --clobber --repo ${{ github.repository }}
            if ($LASTEXITCODE -ne 0) { throw "upload failed: $($_.Name)" }
          }

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error
